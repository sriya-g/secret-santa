# Docker Compose configuration for Secret Santa

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: secret-santa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: secretsanta
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecretSanta2024DBPass}
      POSTGRES_DB: secretsanta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretsanta"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Prisma migration service (runs once on startup)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: secret-santa-migrate
    environment:
      - DATABASE_URL=postgresql://secretsanta:${DB_PASSWORD:-SecretSanta2024DBPass}@db:5432/secretsanta?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "db", "push", "--skip-generate"]
    restart: "no"

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secret-santa-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://secretsanta:${DB_PASSWORD:-SecretSanta2024DBPass}@db:5432/secretsanta?schema=public
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["node", "server.js"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
